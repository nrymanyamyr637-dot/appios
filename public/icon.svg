<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="letterA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dbe9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background Hexagon -->
  <polygon points="256,24 456,139 456,373 256,488 56,373 56,139" fill="#090d16" stroke="url(#cyberBorder)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Inner Glow Ring -->
  <polygon points="256,44 436,148 436,364 256,468 76,364 76,148" fill="#0c1220" stroke="rgba(0, 240, 255, 0.2)" stroke-width="3" stroke-linejoin="round" />

  <!-- PCB Circuit Traces & Nodes -->
  <!-- Left horizontal trace -->
  <line x1="56" y1="256" x2="160" y2="256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <circle cx="160" cy="256" r="14" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle cx="160" cy="256" r="6" fill="#090d16" />

  <!-- Right horizontal trace -->
  <line x1="352" y1="256" x2="456" y2="256" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />
  <circle cx="352" cy="256" r="14" fill="#a855f7" filter="url(#neonGlow)" />
  <circle cx="352" cy="256" r="6" fill="#090d16" />

  <!-- Top vertical trace -->
  <line x1="256" y1="44" x2="256" y2="150" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="150" r="14" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle cx="256" cy="150" r="6" fill="#090d16" />

  <!-- Center 'A' Logo Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Main Triangular Stem of A -->
    <path d="M256 160 L168 368 L218 368 L236 322 L276 322 L294 368 L344 368 Z M256 242 L242 284 L270 284 Z" fill="url(#letterA)" />
    <!-- Glowing Microchip Center Node inside A -->
    <rect x="242" y="258" width="28" height="28" rx="6" fill="#00f0ff" />
    <rect x="248" y="264" width="16" height="16" rx="3" fill="#090d16" />
  </g>
</svg>
